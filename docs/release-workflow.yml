name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if ('v'+require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm pack
      - name: Build standalone ZIP
        run: |
          mkdir -p release
          tar -xzf agent-html-collab-*.tgz -C release
          cd release
          zip -qr ../agent-html-collab-${{ github.ref_name }}.zip package
      - name: Checksums
        run: sha256sum agent-html-collab-*.tgz agent-html-collab-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-html-collab-package
          path: |
            agent-html-collab-*.tgz
            agent-html-collab-*.zip
            SHA256SUMS.txt
      - name: Create draft Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" agent-html-collab-*.tgz agent-html-collab-*.zip SHA256SUMS.txt --verify-tag --draft --title "Agent HTML Collab $GITHUB_REF_NAME" --notes-file CHANGELOG.md
