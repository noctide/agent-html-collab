<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProtoBridge 协同工具</title>
<!-- ============================================================
     ProtoBridge 内核 studio(agent 无关,纯 Web)
     - 方案 HTML 装进 iframe(同源注入桥接脚本)
     - 配置驱动:window.PROTO_CONFIG(serve.mjs 注入)或 ?config= 指定
     - 无配置时使用内置默认值,行为零破坏
     ============================================================ -->
<!-- PROTOBRIDGE_CONFIG -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --pb-paper: #eeece8; --pb-panel: #f7f6f3;
    --pb-ink: #20211f; --pb-gray: #686a64;
    --pb-line: #d6d4ce; --pb-chip: #e2e0da;
    --pb-teal: #27685f; --pb-teal-bg: #e0e9e3;
    --pb-ochre: #95603a; --pb-danger: #a33a2e;
  }
  body { font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--pb-paper); color: var(--pb-ink); display: flex; flex-direction: column; overflow: hidden; }

  #bar { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px; height: 56px; background: var(--pb-paper); color: var(--pb-ink); border-bottom: 1px solid var(--pb-line); z-index: 10; }
  #bar .brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 13.5px; margin-right: 4px; white-space: nowrap; border: 0; background: transparent; color: var(--pb-ink); padding: 5px 7px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  #bar .brand:hover { background: var(--pb-chip); }
  #bar .brand .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--pb-ink); color: var(--pb-paper); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none; }
  #bar .brand #brand-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar .brand .caret { font-size: 10px; color: var(--pb-gray); flex: none; }
  @media (prefers-reduced-motion: reduce) { .pop, #toast.show { animation: none; } }
  #bar .sep { width: 1px; height: 20px; background: var(--pb-line); flex: none; }
  #bar button, #bar select { font: inherit; font-size: 12.5px; border: 1px solid transparent; background: transparent; color: var(--pb-gray); border-radius: 6px; padding: 6px 11px; cursor: pointer; line-height: 1.3; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
  #bar button:hover, #bar select:hover { background: var(--pb-chip); color: var(--pb-ink); }
  #bar button:focus-visible, #bar select:focus-visible { outline: 2px solid var(--pb-teal); outline-offset: 1px; }
  #bar .seg { display: flex; gap: 2px; background: transparent; border: 0; border-radius: 7px; padding: 2px; }
  #bar .seg button { border: 0; background: transparent; padding: 5px 13px; border-radius: 6px; color: var(--pb-gray); }
  #bar .seg button:hover { background: var(--pb-chip); color: var(--pb-ink); }
  #bar .seg button.on { background: var(--pb-chip); color: var(--pb-ink); font-weight: 600; }
  #bar select { max-width: 240px; }
  #bar .zoom { display: flex; align-items: center; gap: 2px; }
  #bar .zoom button { padding: 6px 9px; }
  #bar .zoom select { max-width: 108px; }
  #bar .spacer { flex: 1; }
  #bar .count { font-size: 12px; color: var(--pb-gray); white-space: nowrap; }
  #bar .count b { color: var(--pb-gray); font-variant-numeric: tabular-nums; font-weight: 600; }
  #bar .count b.c-more { color: var(--pb-teal); }
  #bar .count b.e-more { color: var(--pb-ochre); }
  #bar #more { position: relative; }
  #bar #more .bdg { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; padding: 0 4px; background: var(--pb-ochre); color: #fff; border-radius: 8px; font-size: 10px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 1.5px solid var(--pb-paper); }
  #bar #more .bdg.show { display: flex; }
  #bar .send { background: var(--pb-teal-bg); border-color: transparent; color: var(--pb-teal); font-weight: 600; }
  #bar .send:hover { background: var(--pb-teal); color: #fff; }
  #bar .send:disabled { opacity: .55; cursor: default; }
  #bar #notify.off { color: #a9a79f; }
  #bar > * { flex-shrink: 0; }

  /* 窄侧栏使用两行工具栏，保留页面选择和缩放入口。 */
  @media (max-width: 1180px) { #bar .brand { max-width: 170px; } }
  @media (max-width: 980px) { #bar .count { display: none; } }
  @media (max-width: 840px) {
    #bar { flex-wrap: wrap; height: auto; gap: 4px; padding: 8px 10px; }
    #bar .brand { max-width: 150px; }
    #bar .sep, #bar .spacer, #notify { display: none; }
    #bar .zoom { display: flex; margin-left: auto; }
    #bar #page-sel { max-width: 170px; }
    #bar .seg button { padding: 6px 9px; }
  }
  #current-path { flex: none; display: block; width: 100%; min-height: 32px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px 12px; border: 0; border-bottom: 1px solid var(--pb-line); background: var(--pb-panel); color: var(--pb-gray); font: 12px Consolas, monospace; cursor: pointer; }
  #current-path:focus-visible { outline: 2px solid var(--pb-teal); outline-offset: -2px; }

  #stage { flex: 1; position: relative; overflow: auto; background: var(--pb-paper); }
  #stage::-webkit-scrollbar { width: 11px; height: 11px; }
  #stage::-webkit-scrollbar-thumb { background: #d2d0ca; border-radius: 6px; border: 2.5px solid var(--pb-paper); }
  #stage::-webkit-scrollbar-thumb:hover { background: #bebcb5; }
  #stage::-webkit-scrollbar-corner { background: transparent; }
  #fit { position: relative; margin: 0 auto; transform-origin: 0 0; }
  #proto { position: absolute; top: 0; left: 0; transform-origin: 0 0; border: 0; background: #fff; box-shadow: 0 6px 28px rgba(32,33,31,.10), 0 0 0 1px var(--pb-line); }

  #mmap { position: fixed; right: 16px; bottom: 16px; z-index: 90; width: 196px; background: var(--pb-panel); border: 1px solid var(--pb-line); border-radius: 8px; box-shadow: 0 12px 30px rgba(32,33,31,.14); overflow: hidden; }
  #mmap .mh { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; color: var(--pb-gray); font-size: 11px; letter-spacing: .3px; }
  #mmap .mh button { border: 0; background: none; color: var(--pb-gray); cursor: pointer; font-size: 12px; padding: 0 2px; font-family: inherit; }
  #mmap .mh button:hover { color: var(--pb-ink); }
  #mmap .mbody { position: relative; margin: 0 8px 8px; cursor: crosshair; background: #e6e4de; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--pb-line) inset; }
  #mmap .thumb { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  #mmap .vp { position: absolute; border: 1.5px solid var(--pb-teal); background: rgba(39,104,95,.10); cursor: grab; border-radius: 2px; }
  #mmap.fold .mbody { display: none; }
  #mmap.fold { width: auto; }

  .pop { position: fixed; z-index: 100; background: var(--pb-panel); color: var(--pb-ink); border: 1px solid var(--pb-line); border-radius: 6px; box-shadow: 0 12px 32px rgba(32,33,31,.14); padding: 12px; min-width: 250px; animation: pop-in .14s ease; font-size: 12.5px; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .pop .ph { font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--pb-ink); }
  .pop .ph .x { border: 0; background: none; cursor: pointer; color: var(--pb-gray); font-size: 14px; padding: 0 2px; }
  .pop .ph .x:hover { color: var(--pb-ink); }
  .pop .elinfo { font-size: 12px; color: var(--pb-gray); background: #efede8; border: 1px solid var(--pb-line); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; line-height: 1.5; word-break: break-all; }
  .pop .elinfo code { font-family: Consolas, monospace; font-size: 11px; color: var(--pb-teal); }
  .pop label { display: block; font-size: 11.5px; color: var(--pb-gray); margin: 7px 0 3px; }
  .pop select, .pop textarea, .pop input { width: 100%; font: inherit; font-size: 12.5px; border: 1px solid var(--pb-line); border-radius: 6px; padding: 6px 8px; background: #fff; color: var(--pb-ink); }
  .pop select:focus, .pop textarea:focus, .pop input:focus { outline: none; border-color: var(--pb-teal); box-shadow: 0 0 0 3px rgba(39,104,95,.15); }
  .pop textarea { min-height: 62px; resize: vertical; }
  .pop .row2 { display: flex; gap: 8px; }
  .pop .row2 > div { flex: 1; }
  .pop .pmeta { display: flex; gap: 8px; align-items: baseline; margin: 2px 0 4px; }
  .pop .pmeta .k { flex: none; font-size: 11px; color: var(--pb-gray); }
  .pop .pmeta .path { font-family: Consolas, monospace; font-size: 11.5px; color: var(--pb-ink); word-break: break-all; }
  .pop .mtitle { font-size: 11px; color: var(--pb-gray); margin: 10px 0 2px; }
  .pop .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 11px; }
  .pop .foot button { font: inherit; font-size: 12px; border-radius: 6px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--pb-line); background: #fff; color: var(--pb-ink); }
  .pop .foot button:hover { background: var(--pb-chip); }
  .pop .foot .ok { background: var(--pb-teal); border-color: var(--pb-teal); color: #fff; font-weight: 600; }
  .pop .foot .ok:hover { background: #1f554e; border-color: #1f554e; }
  .pop .foot .danger { color: var(--pb-danger); border-color: #e2c9c4; background: #fbf3f1; }
  .pop .sum { color: var(--pb-gray); line-height: 1.6; margin-bottom: 10px; }
  .pop .sum b { color: var(--pb-ink); }
  .pop .sum span { font-size: 11.5px; color: var(--pb-gray); }
  .pop .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--pb-ink); }
  .pop .mi:hover { background: var(--pb-chip); }
  .pop .mi.dis { color: #a9a79f; cursor: default; }
  .pop .mi.dis:hover { background: none; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; background: var(--pb-panel); color: var(--pb-ink); font-size: 12.5px; line-height: 1.6; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--pb-line); max-width: 640px; box-shadow: 0 12px 30px rgba(32,33,31,.16); display: none; pointer-events: none; }
  #toast.show { display: block; animation: pop-in .18s ease; }
</style>
</head>
<body>

<div id="bar">
  <button class="brand" id="proj-entry" title="项目 / 源文件">
    <span class="logo" id="brand-logo">P</span>
    <span id="brand-title">ProtoBridge</span>
    <span class="caret">▾</span>
  </button>
  <span class="sep"></span>
  <div class="seg" title="原型模式">
    <button data-x="m-browse" class="on">浏览</button>
    <button data-x="m-edit" title="快捷键 E:就地改文字">编辑</button>
    <button data-x="m-anno" title="快捷键 A:任意元素提意见(含区域编号)">标注</button>
  </div>
  <span class="sep"></span>
  <select id="page-sel" title="切换页面(← →)"></select>
  <span class="spacer"></span>
  <div class="zoom" title="缩放(Ctrl+滚轮)">
    <button id="zoom-out" title="缩小">−</button>
    <select id="zoom-sel">
      <option value="fit">适应宽度</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
    <button id="zoom-in" title="放大">＋</button>
  </div>
  <span class="sep"></span>
  <span class="count" id="count"></span>
  <button id="notify" title="是否通知本页面所属对话（需客户端接入）">协同通知:开</button>
  <button class="send" id="send">发送反馈 ↗</button>
  <button id="more" title="操作:还原 / 导出导入 / 缩放">⋯<span class="bdg" id="undo-bdg"></span></button>
</div>

<button id="current-path" type="button" title="点击复制当前编辑页面的路径"></button>
<div id="stage">
  <div id="fit"><iframe id="proto" title="方案预览"></iframe></div>
</div>

<div id="mmap">
  <div class="mh"><span>导航 · 小地图</span><button id="mmap-fold" title="折叠/展开">▾</button></div>
  <div class="mbody" id="mmap-body"><div class="thumb" id="mmap-thumb"></div><div class="vp" id="mmap-vp"></div></div>
</div>

<div id="toast"></div>
<style id="mm-styles"></style>

<!-- 注入 iframe 的样式 -->
<style type="text/plain" id="bridge-css">
.pb-anno-fab { display: none !important; }
body.pbx-panning, body.pbx-panning * { cursor: grabbing !important; user-select: none !important; }
.pbx-hover { outline: 2px solid #27685f !important; outline-offset: -1px; cursor: crosshair !important; }
.pbx-editing { outline: 2px solid #27685f !important; outline-offset: 1px; background: rgba(39,104,95,.07); }
.pbx-edited { text-decoration: underline dotted #95603a; text-underline-offset: 3px; }
#pbx-chip-layer { position: absolute; top: 0; left: 0; width: 100%; height: 0; z-index: 8990; pointer-events: none; }
.pbx-echip { position: absolute; pointer-events: auto; cursor: pointer; background: #27685f; color: #fff; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 6px; border: 1.5px solid #fff; box-shadow: 0 2px 6px rgba(32,33,31,.28); }
.pbx-echip:hover { background: #1f554e; }
</style>

<!-- 注入 iframe 的桥接脚本(配置来自 window.PROTOBRIDGE_CFG) -->
<script type="text/plain" id="bridge-src">
(function () {
  'use strict';
  if (window.__PB_BRIDGE) return;
  window.__PB_BRIDGE = true;

  var CFG = window.PROTOBRIDGE_CFG || {};
  var PC = CFG.pages || {};
  var CONTAINER = PC.container || '.pg-sec';
  var ACTIVE = PC.activeClass || 'act';
  var IDATTR = PC.idAttr || 'data-page';
  var ROOTID = PC.rootId || 'pg-{id}';
  var SWITCH = PC.switch || 'auto';
  var SINGLE = !!PC.single;                 /* 单文档:整页一页,无活动类约定 */
  var PERFILE = !!PC.singlePerFile;         /* 多文件,每文件整页 */
  var WHOLE = SINGLE || PERFILE;            /* 整页即页根(不分活动容器) */
  var DEFAULTID = PC.defaultId || '';       /* 单文档缺 idAttr 时的稳定页 id */
  var PAGESEL = (!WHOLE && ACTIVE) ? (CONTAINER + '.' + ACTIVE) : CONTAINER;
  var ST = CFG.storage || {};
  var EKEY = ST.edits || 'proto.edits';
  var CKEY = ST.comments || 'proto.anno.comments';
  var NKEY = ST.ecount || 'proto.anno.ecount';
  var WL = (CFG.ui && CFG.ui.whitelist) || ['.pb-badge', '.pb-pop', '.pb-anno-fab', '.pbx-echip'];
  var mode = 'browse';

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function textOf(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function post(type, data) { try { parent.postMessage(Object.assign({ type: type }, data || {}), '*'); } catch (e) {} }
  function inUI(t) { if (!t || !t.closest) return false; for (var i = 0; i < WL.length; i++) { try { if (t.closest(WL[i])) return true; } catch (e) {} } return false; }
  function typing(t) { return !!(t.closest && t.closest('input,textarea,select,[contenteditable="true"]')); }
  function activeSec() { return document.querySelector(PAGESEL); }
  function pageRoot(id) {
    if (WHOLE) return document.querySelector(CONTAINER);
    if (!id) return null;
    var byAttr = null;
    try { byAttr = document.querySelector('[' + IDATTR + '="' + String(id).replace(/"/g, '\\"') + '"]'); } catch (e) {}
    return byAttr || document.getElementById(ROOTID.replace('{id}', id));
  }
  /* 每文件整页:用当前文件路径反查 pages.list 得到页 id */
  function perFileId() {
    var list = PC.list || [], path = location.pathname;
    try { path = decodeURIComponent(location.pathname); } catch (e) {}
    for (var i = 0; i < list.length; i++) if (list[i].file && path.indexOf(list[i].file) >= 0) return list[i].id;
    return DEFAULTID || '';
  }
  function curPage() {
    if (PERFILE) return perFileId();
    var s = activeSec();
    if (s) return s.getAttribute(IDATTR) || (SINGLE ? DEFAULTID : '') || '';
    var b = document.body.getAttribute(IDATTR);
    return (b && b !== 'allinone') ? b : (SINGLE ? DEFAULTID : '');
  }
  function isAuto() { return SWITCH === 'auto'; }

  function setMode(m) {
    mode = m;
    document.body.classList.toggle('pbx-edit', m === 'edit');
    document.body.classList.toggle('pbx-anno', m === 'anno');
    positionChips();
    if (hoverEl) { hoverEl.classList.remove('pbx-hover'); hoverEl = null; }
  }

  /* ---------- 页面切换(内核默认切换器,switch=auto) ---------- */
  function showPage(id) {
    if (SINGLE) { var pid = id || curPage(); applyEdits(pid); positionChips(); post('pbx-page', { page: pid }); return true; }
    var secs = document.querySelectorAll(CONTAINER);
    var found = null;
    Array.prototype.forEach.call(secs, function (s) {
      var on = s.getAttribute(IDATTR) === id;
      s.classList.toggle(ACTIVE, on);
      if (on) found = s;
    });
    if (!found) return false;
    document.body.classList.toggle('on-mob', found.classList.contains('is-mobile'));
    window.scrollTo(0, 0);
    applyEdits(id); positionChips();
    post('pbx-page', { page: id });
    return true;
  }

  /* ---------- 文字编辑 ---------- */
  function buildPath(el) {
    var s = el.closest(CONTAINER), parts = [];
    while (el && el !== s) {
      var same = Array.prototype.filter.call(el.parentNode.children, function (c) { return c.tagName === el.tagName; });
      parts.unshift(el.tagName.toLowerCase() + (same.length > 1 ? ':nth-of-type(' + (same.indexOf(el) + 1) + ')' : ''));
      el = el.parentElement;
    }
    return parts.join('>');
  }
  function queryPath(root, path) {
    var parent = root, el = null;
    (path || '').split('>').forEach(function (seg) {
      if (!parent) return;
      var m = seg.match(/^([\w-]+)(?::nth-of-type\((\d+)\))?$/); if (!m) { parent = null; return; }
      var kids = Array.prototype.filter.call(parent.children, function (c) { return c.tagName.toLowerCase() === m[1]; });
      parent = kids[(m[2] ? +m[2] : 1) - 1] || null; el = parent;
    });
    return el;
  }
  function findEl(pageId, rec) {
    var s = pageRoot(pageId); if (!s) return null;
    var el = queryPath(s, rec.path);
    if (el && textOf(el) === rec.from) return el;
    var all = s.querySelectorAll('*');
    for (var i = 0; i < all.length; i++) if (textOf(all[i]) === rec.from) return all[i];
    return el || null;
  }
  function setTextOnly(el, text) {
    var done = false;
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 3 && n.nodeValue.trim()) { if (!done) { n.nodeValue = text; done = true; } else n.nodeValue = ''; }
    }
    if (!done) el.insertBefore(document.createTextNode(text), el.firstChild);
  }
  function applyEdits(pageId) {
    (lsGet(EKEY, {})[pageId] || []).forEach(function (r) {
      var el = findEl(pageId, r);
      if (el) { setTextOnly(el, r.to); el.classList.add('pbx-edited'); }
    });
  }
  function saveEdit(pageId, el, from, to) {
    var all = lsGet(EKEY, {}); var recs = all[pageId] = all[pageId] || [];
    var path = buildPath(el), hit = null;
    recs.forEach(function (r) { if (r.path === path) hit = r; });
    if (hit) { hit.from = from; hit.to = to; hit.ts = new Date().toISOString(); }
    else recs.push({ path: path, from: from, to: to, ts: new Date().toISOString() });
    lsSet(EKEY, all); el.classList.add('pbx-edited');
  }
  function revertRec(pageId, rec) {
    var el = findEl(pageId, rec); if (!el) return false;
    if (textOf(el) === rec.to) setTextOnly(el, rec.from);
    el.classList.remove('pbx-edited');
    return true;
  }
  function resetPage() {
    var pageId = curPage(); var all = lsGet(EKEY, {}); var recs = all[pageId] || [];
    recs.forEach(function (r) { revertRec(pageId, r); });
    delete all[pageId]; lsSet(EKEY, all);
    return recs.length;
  }
  function resetAll() {
    var all = lsGet(EKEY, {}), n = 0;
    Object.keys(all).forEach(function (pg) { (all[pg] || []).forEach(function (r) { if (revertRec(pg, r)) n++; }); });
    lsSet(EKEY, {}); return n;
  }
  function undoLast() {
    var all = lsGet(EKEY, {}), best = null, bestPg = null;
    Object.keys(all).forEach(function (pg) { (all[pg] || []).forEach(function (r) { if (!best || (r.ts || '') > (best.ts || '')) { best = r; bestPg = pg; } }); });
    if (!best) return null;
    revertRec(bestPg, best);
    all[bestPg] = (all[bestPg] || []).filter(function (r) { return r !== best; });
    if (!all[bestPg].length) delete all[bestPg];
    lsSet(EKEY, all);
    return { page: bestPg, path: best.path, from: best.from };
  }
  function resetElement(pageId, path) {
    var all = lsGet(EKEY, {}); var recs = all[pageId] || [];
    for (var i = 0; i < recs.length; i++) {
      if (recs[i].path === path) {
        var ok = revertRec(pageId, recs[i]); recs.splice(i, 1);
        if (!recs.length) delete all[pageId];
        lsSet(EKEY, all); return ok;
      }
    }
    return false;
  }

    if (mode !== 'anno' || inUI(e.target)) return;
    var el = e.target.closest && e.target.closest(PAGESEL);
    if (!el || e.target === el) return;
    e.preventDefault(); e.stopPropagation();
    var t = e.target.closest(PAGESEL + ' *') || e.target;
    var r = t.getBoundingClientRect();
    post('pbx-pick', { page: curPage(), path: buildPath(t), label: elLabel(t), text: textOf(t).slice(0, 60),

    var s = activeSec(); if (!s) return;
    var comments = lsGet(CKEY, {});

        var cand = s.querySelectorAll('*');
        for (var i = 0; i < cand.length; i++) if (textOf(cand[i]).slice(0, 20) === (rec.origText || '').slice(0, 20)) { el = cand[i]; break; }
      }
      if (!el) return;
      var r = el.getBoundingClientRect();
      var chip = document.createElement('div');
      chip.className = 'pbx-echip'; chip.textContent = id.split('-')[1];
      chip.title = rec.region + '\n' + (rec.comment || '');
      chip.style.left = Math.max(2, r.right - 30) + 'px';
      chip.style.top = Math.max(2, r.top - 22) + 'px';
      chip.addEventListener('click', function (e) {

    if (isTextInput(e.target)) return;

  }, { passive: false });

<script src="/tool-res/host-transport.js"></script>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);

  /* ---------- 配置合并(内核默认值 → 注入配置 → URL 覆盖) ---------- */
  var DEFAULTS = {
    title: 'ProtoBridge',
    source: { mode: 'single', file: 'proto.html', dir: 'pages/', urls: [], entry: '', index: '' },
    pages: { container: '.pg-sec', activeClass: 'act', idAttr: 'data-page', switch: 'auto', rootId: 'pg-{id}', list: [], overview: null, single: false, singlePerFile: false, defaultId: '' },

  };
  function merge(a, b) {
    if (!b) return a;

      var v = b[k];

      else a[k] = v;
    });
    return a;
  }
  var CFG = merge(merge({}, DEFAULTS), window.PROTO_CONFIG || {});
  if (qs.get('title')) CFG.title = qs.get('title');
  if (qs.get('src')) CFG.source.entry = qs.get('src');
  var PC = CFG.pages, CONTAINER = PC.container, ACTIVE = PC.activeClass, IDATTR = PC.idAttr, ROOTID = PC.rootId;
  var SINGLE = !!PC.single, PERFILE = !!PC.singlePerFile, DEFAULTID = PC.defaultId || '';
  var WHOLE = SINGLE || PERFILE;
  var PAGESEL = (!WHOLE && ACTIVE) ? (CONTAINER + '.' + ACTIVE) : CONTAINER;
  var ST = CFG.storage;

  var SRC = CFG.source.entry || '';
  function currentFilePath() {
    var path = SRC;
    try { path = decodeURIComponent(path); } catch (e) {}
    var projectPrefix = '/' + 'project/';
    var marker = path.indexOf(projectPrefix);
    if (marker >= 0 && CFG._meta && CFG._meta.projectRoot) {
      var root = CFG._meta.projectRoot;
      var relative = path.slice(marker + projectPrefix.length).split('?')[0];

  function updateCurrentPath() {

    label.title = currentFilePath() + '（点击复制）';

  updateCurrentPath();
  document.getElementById('current-path').addEventListener('click', async function () {
    try { await navigator.clipboard.writeText(currentFilePath()); toast('当前页面路径已复制'); }

  var iframe = document.getElementById('proto');
  var fit = document.getElementById('fit');
  var stage = document.getElementById('stage');

  var mode = 'browse';
  var resCache = {};

  /* ---------- 顶栏品牌 ---------- */
  document.title = CFG.title + ' · Studio';
  document.getElementById('brand-title').textContent = CFG.title;
  document.getElementById('brand-logo').textContent = (CFG.title || 'P').trim().charAt(0).toUpperCase();

  /* ---------- 项目入口:下拉展示源文件路径 ---------- */
  document.getElementById('proj-entry').addEventListener('click', function () {
    var p = openPop(document.getElementById('proj-entry'),
      '<div class="ph"><span>' + esc(CFG.title) + '</span></div>' +
      '<div class="pmeta"><span class="k">源文件</span><code class="path">' + esc(currentFilePath() || '(未指定)') + '</code></div>' +
      '<div class="foot"><button data-x="copy">复制路径</button></div>');

    });

  var toastEl = $('#toast'), toastTimer = null;

  function fetchRes(path) { if (!resCache[path]) resCache[path] = fetch(path).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }); return resCache[path]; }

  /* ---------- 页面根/页面清单 ---------- */
  function rootEl(id) { if (WHOLE) { try { return doc.querySelector(CONTAINER); } catch (e) { return null; } } try { return doc.querySelector('[' + IDATTR + '="' + String(id).replace(/"/g, '\\"') + '"]') || doc.getElementById(ROOTID.replace('{id}', id)); } catch (e) { return null; } }
  function activeRoot() { try { return doc.querySelector(PAGESEL); } catch (e) { return null; } }
  function currentPage() {
    if (PERFILE) {
      var path = SRC; try { path = decodeURIComponent(SRC); } catch (e0) {}

    }

  }

  }

  }

    return CFG.viewport.desktop || 1440;
  }

  /* ---------- 注入(配置驱动 + 可选 anno) ---------- */

    try { if (win.location && win.location.pathname) SRC = win.location.pathname; } catch (e) {}   /* 页面内跳转后同步当前页 */
    updateCurrentPath();
    if (win.__PB_INJECTED) return;
    win.__PB_INJECTED = true;
    try { win.PROTOBRIDGE_CFG = CFG; } catch (e) {}
    injectNode('style', $('#bridge-css').textContent);
    injectNode('style', 'body.pbx-edit ' + PAGESEL + ' { cursor: text; } body.pbx-anno ' + PAGESEL + ' { cursor: crosshair; }');
    var jobs = [];
    if (CFG.tools && CFG.tools.anno) {
      jobs = Promise.all([
        fetchRes('/tool-res/annotation-map.js').catch(function () { return 'window.PROTO_ANNO_MAP={pages:{}};'; }),
        fetchRes('/tool-res/anno.js'),
        fetchRes('/tool-res/anno.css'),
      ]).then(function (r) {
        try { injectNode('script', r[0]); injectNode('script', r[1]); injectNode('style', r[2]); }
        catch (e) { toast('标注组件注入失败:' + e.message); }
      }).catch(function () { toast('标注组件资源加载失败(需要本地服务)'); });
    }

    Promise.resolve(jobs).then(function () {
      if (win.ResizeObserver) {
        var lastH = 0;
        new win.ResizeObserver(function () { var h = docH(); if (Math.abs(h - lastH) < 2) return; lastH = h; applyZoom(); }).observe(doc.body);
      }
      syncPages(); syncSelect(); refreshCount(); applyZoom(); buildMinimap();
    });
  }
  iframe.addEventListener('load', injectAll);

  /* ---------- 缩放 ---------- */
  function stageW() { return stage.clientWidth; }
  function stageH() { return stage.clientHeight; }
  function docH() { try { return Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight); } catch (e) { return 900; } }
  function applyZoom() {
    var sw = stageW();
    if (fitMode) scale = Math.min(1.6, Math.max(0.2, sw / contentW));
    var dh = sameOrigin ? docH() : stageH();
    iframe.style.width = contentW + 'px';
    iframe.style.height = dh + 'px';
    iframe.style.transform = 'scale(' + scale + ')';
    fit.style.width = (contentW * scale) + 'px';
    fit.style.height = (dh * scale) + 'px';
    var label = fitMode ? '适应宽度' : Math.round(scale * 100) + '%';
    var sel = $('#zoom-sel');
    var hit = [].slice.call(sel.options).some(function (o) { return o.value === String(+scale.toFixed(2)); });
    if (!fitMode && !hit) {
      var custom = sel.querySelector('option[data-custom]'); if (custom) custom.remove();
      var o = document.createElement('option'); o.value = String(+scale.toFixed(2)); o.textContent = label; o.setAttribute('data-custom', '1'); sel.appendChild(o);
    }
    sel.value = fitMode ? 'fit' : String(+scale.toFixed(2));
    updateMinimapRect();
  }
  function setZoom(v, anchor) {
    var oldS = scale;
    if (v === 'fit') { fitMode = true; } else { fitMode = false; scale = Math.min(2, Math.max(0.25, +v)); }

    var ax = anchor ? anchor.x - st.left : stageW() / 2;
    var ay = anchor ? anchor.y - st.top : stageH() / 2;
    var cx = (stage.scrollLeft + ax - fit.offsetLeft) / oldS;
    var cy = (stage.scrollTop + ay - fit.offsetTop) / oldS;
    applyZoom();
    stage.scrollLeft = Math.max(0, cx * scale + fit.offsetLeft - ax);
    stage.scrollTop = Math.max(0, cy * scale + fit.offsetTop - ay);
    updateMinimapRect();
  }
  function stepZoom(f) { setZoom(String(+Math.min(2, Math.max(0.25, scale * f)).toFixed(2))); }
  $('#zoom-sel').addEventListener('change', function (e) { setZoom(e.target.value); });
  $('#zoom-in').addEventListener('click', function () { stepZoom(1.1); });
  $('#zoom-out').addEventListener('click', function () { stepZoom(1 / 1.1); });
  window.addEventListener('resize', function () { applyZoom(); updateMinimapRect(); });

  /* ---------- 切页 ---------- */
  function gotoPage(id) {

    if (CFG.source.mode === 'pages' && entry && entry.file) {
      SRC = '/project/' + entry.file;
      iframe.src = frameSrc(SRC);

    }

    var css = '';
    [].slice.call(doc.styleSheets).forEach(function (sheet) { try { css = walk(sheet.cssRules, null, css); } catch (e) {} });
    $('#mm-styles').textContent = css;
  }
  function buildMinimap() {
    var thumb = $('#mmap-thumb'), body = $('#mmap-body');
    if (!sameOrigin || !doc) return;
    var act = activeRoot(); if (!act) return;
    importProtoStyles();
    var pageH = Math.max(doc.documentElement.scrollHeight, act.scrollHeight);
    mmapScale = 178 / contentW;
    var th = Math.max(48, Math.min(window.innerHeight * 0.3, pageH * mmapScale));
    body.style.height = th + 'px';
    var clone = act.cloneNode(true);
    clone.className = act.className + ' pbx-mm-clone';
    var rootStyles = win.getComputedStyle(doc.documentElement);
    for (var si = 0; si < rootStyles.length; si++) { var key = rootStyles[si]; if (key.indexOf('--') === 0) clone.style.setProperty(key, rootStyles.getPropertyValue(key)); }
    clone.querySelectorAll(WLJOIN() + ',#pb-badge-layer,#pbx-chip-layer').forEach(function (n) { n.remove(); });
    clone.style.width = contentW + 'px';
    thumb.innerHTML = ''; thumb.style.width = contentW + 'px'; thumb.style.height = pageH + 'px';
    thumb.style.transform = 'scale(' + mmapScale + ')';
    thumb.appendChild(clone);
    updateMinimapRect();
  }
  function WLJOIN() { return (CFG.ui.whitelist || []).join(','); }
  function updateMinimapRect() {
    if (!win) return;
    var vp = $('#mmap-vp');
    var vw = stageW() / scale, vh = stageH() / scale;
    vp.style.left = Math.max(0, (stage.scrollLeft - fit.offsetLeft) / scale * mmapScale) + 'px';
    vp.style.top = Math.max(0, (stage.scrollTop - fit.offsetTop) / scale * mmapScale) + 'px';
    vp.style.width = Math.max(8, vw * mmapScale) + 'px';
    vp.style.height = Math.max(6, vh * mmapScale) + 'px';
  }
  (function () {
    var body = $('#mmap-body'), dragging = false;
    function jump(e) {
      var r = body.getBoundingClientRect();
      var x = (e.clientX - r.left) / mmapScale, y = (e.clientY - r.top) / mmapScale;
      stage.scrollLeft = Math.max(0, x * scale + fit.offsetLeft - stageW() / 2);
      stage.scrollTop = Math.max(0, y * scale + fit.offsetTop - stageH() / 2);
    }
    body.addEventListener('mousedown', function (e) { dragging = true; jump(e); e.preventDefault(); });
    document.addEventListener('mousemove', function (e) { if (dragging) jump(e); });
    document.addEventListener('mouseup', function () { dragging = false; });
  })();
  stage.addEventListener('scroll', updateMinimapRect, { passive: true });
  $('#mmap-fold').addEventListener('click', function () { var m = $('#mmap'); m.classList.toggle('fold'); this.textContent = m.classList.contains('fold') ? '▸' : '▾'; });

  /* ---------- 启动 ---------- */
  mode = qs.get('anno') === '1' ? 'anno' : (lsGet(ST.mode, 'browse'));
  paintMode(); applyZoom();
})();
</script>
</body>
