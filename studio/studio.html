<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent HTML Collab</title>
<!-- ============================================================
     Agent HTML Collab 内核 studio(agent 无关,纯 Web)
     - 方案 HTML 装进 iframe(同源注入桥接脚本)
     - 配置驱动:window.PROTO_CONFIG(serve.mjs 注入)或 ?config= 指定
     - 无配置时使用内置默认值,行为零破坏
     ============================================================ -->
<!-- PROTOBRIDGE_CONFIG -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --pb-paper: #eeece8; --pb-panel: #f7f6f3;
    --pb-ink: #20211f; --pb-gray: #686a64;
    --pb-line: #d6d4ce; --pb-chip: #e2e0da;
    --pb-teal: #27685f; --pb-teal-bg: #e0e9e3;
    --pb-ochre: #95603a; --pb-danger: #a33a2e;
  }
  body { font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--pb-paper); color: var(--pb-ink); display: flex; flex-direction: column; overflow: hidden; }

  #bar { position: relative; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px; height: 56px; background: var(--pb-paper); color: var(--pb-ink); border-bottom: 1px solid var(--pb-line); z-index: 10; }
  #bar .brand { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 700; font-size: 13.5px; margin-right: 4px; white-space: nowrap; border: 0; background: transparent; color: var(--pb-ink); padding: 5px 7px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  #bar .brand:hover { background: var(--pb-chip); }
  #bar .brand .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--pb-ink); color: var(--pb-paper); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex: none; }
  @media (prefers-reduced-motion: reduce) { :is(.pop, #move-panel), #toast.show { animation: none; } }
  #bar .sep { width: 1px; height: 20px; background: var(--pb-line); flex: none; }
  #bar button, #bar select { font: inherit; font-size: 12.5px; border: 1px solid transparent; background: transparent; color: var(--pb-gray); border-radius: 6px; padding: 6px 11px; cursor: pointer; line-height: 1.3; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
  #bar button:hover, #bar select:hover { background: var(--pb-chip); color: var(--pb-ink); }
  #bar button:focus-visible, #bar select:focus-visible { outline: 2px solid var(--pb-teal); outline-offset: 1px; }
  #bar #edit-pick[aria-pressed="true"] { background: var(--pb-chip); color: var(--pb-ink); }
  #bar button:disabled { opacity: .45; cursor: default; }
  #bar select { max-width: 280px; }
  #bar .actions { display: flex; align-items: center; gap: 4px; }
  #bar #page-notes { width: 34px; padding: 6px; position: relative; }
  #bar #page-notes svg { display: block; margin: auto; }
  #bar #page-notes.has-feedback { color: var(--pb-teal); }
  #bar #page-notes.has-feedback::after { content: ''; position: absolute; right: 5px; top: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--pb-teal); }
  #bar #page-notes[aria-expanded="true"] { background: var(--pb-chip); }
  #bar #undo { width: 34px; padding: 6px; }
  #bar #undo svg { display: block; margin: auto; }
  #bar .zoom { display: flex; align-items: center; gap: 2px; }
  #bar .zoom button { padding: 6px 9px; }
  #bar .zoom select { max-width: 108px; }
  #bar .spacer { flex: 1; }
  #bar .count { font-size: 12px; color: var(--pb-gray); white-space: nowrap; }
  #bar .count b { color: var(--pb-gray); font-variant-numeric: tabular-nums; font-weight: 600; }
  #bar .count b.c-more { color: var(--pb-teal); }
  #bar .count b.e-more { color: var(--pb-ochre); }
  #bar .send { background: var(--pb-teal-bg); border-color: transparent; color: var(--pb-teal); font-weight: 600; }
  #bar .send:hover { background: var(--pb-teal); color: #fff; }
  #bar .send:disabled { opacity: .55; cursor: default; }
  #bar > * { flex-shrink: 0; }

  @media (max-width: 720px) {
    #bar { flex-wrap: wrap; height: auto; gap: 6px; padding: 8px 10px; }
    #bar #page-sel { flex: 1; min-width: 0; max-width: none; }
    #bar .spacer { display: none; }
    #bar .zoom { margin-right: auto; }
    #bar .actions { margin-left: auto; }
  }
  @media (max-width: 420px) {
    #bar .zoom button { display: none; }
    #bar .count { padding: 6px; }
  }
  #stage { flex: 1; position: relative; overflow: auto; background: var(--pb-paper); }
  #stage::-webkit-scrollbar { width: 11px; height: 11px; }
  #stage::-webkit-scrollbar-thumb { background: #d2d0ca; border-radius: 6px; border: 2.5px solid var(--pb-paper); }
  #stage::-webkit-scrollbar-thumb:hover { background: #bebcb5; }
  #stage::-webkit-scrollbar-corner { background: transparent; }
  #fit { position: relative; margin: 0 auto; transform-origin: 0 0; }
  #proto { position: absolute; top: 0; left: 0; transform-origin: 0 0; border: 0; background: #fff; box-shadow: 0 6px 28px rgba(32,33,31,.10), 0 0 0 1px var(--pb-line); }

  #mmap { position: fixed; right: 16px; bottom: 16px; z-index: 90; width: 196px; background: var(--pb-panel); border: 1px solid var(--pb-line); border-radius: 8px; box-shadow: 0 12px 30px rgba(32,33,31,.14); overflow: hidden; }
  #mmap .mh { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; color: var(--pb-gray); font-size: 11px; letter-spacing: .3px; }
  #mmap .mh button { border: 0; background: none; color: var(--pb-gray); cursor: pointer; font-size: 12px; padding: 0 2px; font-family: inherit; }
  #mmap .mh button:hover { color: var(--pb-ink); }
  #mmap .mbody { position: relative; margin: 0 8px 8px; cursor: crosshair; background: #e6e4de; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--pb-line) inset; }
  #mmap .thumb { position: absolute; top: 0; left: 0; transform-origin: 0 0; pointer-events: none; background: #fff; }
  #mmap .vp { position: absolute; border: 1.5px solid var(--pb-teal); background: rgba(39,104,95,.10); cursor: grab; border-radius: 2px; }
  #mmap.fold .mbody { display: none; }
  #mmap.fold { width: auto; }

  :is(.pop, #move-panel) { position: fixed; z-index: 100; background: var(--pb-panel); color: var(--pb-ink); border: 1px solid var(--pb-line); border-radius: 6px; box-shadow: 0 12px 32px rgba(32,33,31,.14); padding: 12px; min-width: 250px; animation: pop-in .14s ease; font-size: 12.5px; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  :is(.pop, #move-panel) .ph { font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--pb-ink); }
  :is(.pop, #move-panel) .ph .x { border: 0; background: none; cursor: pointer; color: var(--pb-gray); font-size: 14px; padding: 0 2px; }
  :is(.pop, #move-panel) .ph .x:hover { color: var(--pb-ink); }
  :is(.pop, #move-panel) .elinfo { font-size: 12px; color: var(--pb-gray); background: #efede8; border: 1px solid var(--pb-line); border-radius: 6px; padding: 7px 9px; margin-bottom: 8px; line-height: 1.5; word-break: break-all; }
  :is(.pop, #move-panel) .elinfo code { font-family: Consolas, monospace; font-size: 11px; color: var(--pb-teal); }
  :is(.pop, #move-panel) label { display: block; font-size: 11.5px; color: var(--pb-gray); margin: 7px 0 3px; }
  :is(.pop, #move-panel) select, :is(.pop, #move-panel) textarea, :is(.pop, #move-panel) input { width: 100%; font: inherit; font-size: 12.5px; border: 1px solid var(--pb-line); border-radius: 6px; padding: 6px 8px; background: #fff; color: var(--pb-ink); }
  :is(.pop, #move-panel) select:focus, :is(.pop, #move-panel) textarea:focus, :is(.pop, #move-panel) input:focus { outline: none; border-color: var(--pb-teal); box-shadow: 0 0 0 3px rgba(39,104,95,.15); }
  :is(.pop, #move-panel) textarea { min-height: 62px; resize: vertical; }
  :is(.pop, #move-panel) .row2 { display: flex; gap: 8px; }
  :is(.pop, #move-panel) .row2 > div { flex: 1; }
  :is(.pop, #move-panel) .pmeta { display: flex; gap: 8px; align-items: baseline; margin: 2px 0 4px; }
  :is(.pop, #move-panel) .pmeta .k { flex: none; font-size: 11px; color: var(--pb-gray); }
  :is(.pop, #move-panel) .pmeta .path { font-family: Consolas, monospace; font-size: 11.5px; color: var(--pb-ink); word-break: break-all; }
  :is(.pop, #move-panel) .mtitle { font-size: 11px; color: var(--pb-gray); margin: 10px 0 2px; }
  :is(.pop, #move-panel) .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 11px; }
  :is(.pop, #move-panel) .foot button { font: inherit; font-size: 12px; border-radius: 6px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--pb-line); background: #fff; color: var(--pb-ink); }
  :is(.pop, #move-panel) .foot button:hover { background: var(--pb-chip); }
  :is(.pop, #move-panel) .foot button:disabled { opacity: .5; cursor: default; }
  :is(.pop, #move-panel) .foot .ok { background: var(--pb-teal); border-color: var(--pb-teal); color: #fff; font-weight: 600; }
  :is(.pop, #move-panel) .foot .ok:hover { background: #1f554e; border-color: #1f554e; }
  :is(.pop, #move-panel) .foot .danger { color: var(--pb-danger); border-color: #e2c9c4; background: #fbf3f1; }
  :is(.pop, #move-panel) .sum { color: var(--pb-gray); line-height: 1.6; margin-bottom: 10px; }
  :is(.pop, #move-panel) .sum b { color: var(--pb-ink); }
  :is(.pop, #move-panel) .sum span { font-size: 11.5px; color: var(--pb-gray); }
  :is(.pop, #move-panel) .mi { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--pb-ink); }
  :is(.pop, #move-panel) .mi:hover { background: var(--pb-chip); }
  :is(.pop, #move-panel) .mi.dis { color: #a9a79f; cursor: default; }
  :is(.pop, #move-panel) .mi.dis:hover { background: none; }
  :is(.pop, #move-panel) button:focus-visible { outline: 2px solid var(--pb-teal); outline-offset: 2px; }
  .feedback-manager, .feedback-detail { min-width: 0; max-height: calc(100vh - 24px); overflow-y: auto; }
  .feedback-manager { width: min(360px, calc(100vw - 24px)); }
  .feedback-detail { width: min(420px, calc(100vw - 24px)); }
  .feedback-manager .foot { flex-wrap: wrap; }
  .feedback-pages { width: min(360px, calc(100vw - 24px)); min-width: 0; }
  .feedback-pages .page-list { max-height: min(360px, 50vh); overflow-y: auto; }
  .feedback-pages .page-entry { white-space: normal; margin-bottom: 4px; }
  .feedback-pages .page-heading { display: flex; align-items: baseline; gap: 8px; }
  .feedback-pages .page-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .feedback-pages .page-current { font-size: 11px; color: var(--pb-teal); flex: none; }
  .feedback-pages .page-count, .feedback-pages .page-excerpt { display: block; font-size: 12px; color: var(--pb-gray); margin-top: 3px; }
  .feedback-pages .page-excerpt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feedback-pages .page-entry:disabled { cursor: default; opacity: .6; }
  .feedback-pages .page-entry:disabled:hover { background: none; }
  .review-diff { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 6px; margin: 8px 0; overflow-wrap: anywhere; }
  .review-diff span { color: var(--pb-gray); }
  .review-diff del { color: var(--pb-danger); text-decoration: none; white-space: pre-wrap; }
  .review-diff ins { color: var(--pb-teal); text-decoration: none; white-space: pre-wrap; }
  #move-panel { position: fixed; z-index: 95; width: min(300px, calc(100vw - 24px)); overflow-y: auto; }
  #move-panel[hidden] { display: none; }
  .pop { max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow-y: auto; }
  .pop .menu-sep { border: 0; border-top: 1px solid var(--pb-line); margin: 6px 0; }
  .pop .send-preference { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 10px 0; }
  .pop .send-preference input { width: auto; margin: 0; }
  #move-panel .elinfo { max-height: 76px; overflow: auto; }
  #move-panel .move-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #move-panel .move-actions button { font: inherit; padding: 5px 9px; border: 1px solid var(--pb-line); border-radius: 6px; background: #fff; color: var(--pb-ink); cursor: pointer; }
  #move-panel .move-nudge { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  #move-panel .move-nudge button { width: 44px; height: 44px; border: 1px solid var(--pb-line); border-radius: 6px; background: #fff; color: var(--pb-ink); font-size: 18px; cursor: pointer; }
  #move-panel .move-nudge button:hover { background: var(--pb-chip); }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 200; background: var(--pb-panel); color: var(--pb-ink); font-size: 12.5px; line-height: 1.6; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--pb-line); max-width: 640px; box-shadow: 0 12px 30px rgba(32,33,31,.16); display: none; pointer-events: none; }
  #toast.show { display: block; animation: pop-in .18s ease; }
</style>
</head>
<body>

<div id="bar">
  <button class="brand" id="proj-entry" title="Agent HTML Collab · 页面信息" aria-label="Agent HTML Collab · 页面信息">
    <span class="logo">A</span>
  </button>
  <select id="page-sel" title="切换页面（← →）" aria-label="当前页面"></select>
  <button id="page-notes" title="查找有标注的页面" aria-label="查找有标注的页面" aria-haspopup="dialog" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-5l-5 4v-4H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 8h8M8 12h5"/></svg></button>
  <button id="edit-pick" aria-pressed="false" title="选中元素：点击框内改字，拖动右上角手柄移动">编辑</button>
  <span class="spacer"></span>
  <div class="zoom" title="缩放（Ctrl+滚轮）">
    <button id="zoom-out" title="缩小" aria-label="缩小">−</button>
    <select id="zoom-sel" aria-label="缩放"><option value="fit">适应宽度</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select>
    <button id="zoom-in" title="放大" aria-label="放大">＋</button>
  </div>
  <span class="sep"></span>
  <div class="actions">
    <button class="count" id="count" title="查看和管理标注 / 改动" aria-haspopup="dialog"></button>
    <button id="undo" title="撤销最近一处改动（Ctrl+Z）" aria-label="撤销最近一处改动" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2)"/></svg></button>
    <button class="send" id="send">发送</button>
    <button id="more" title="更多操作" aria-label="更多操作" aria-haspopup="dialog">⋯</button>
  </div>
</div>

<div id="stage">
  <div id="fit"><iframe id="proto" title="方案预览"></iframe></div>
</div>

<div id="mmap">
  <div class="mh"><span>导航 · 小地图</span><button id="mmap-fold" title="折叠/展开">▾</button></div>
  <div class="mbody" id="mmap-body"><div class="thumb" id="mmap-thumb"></div><div class="vp" id="mmap-vp"></div></div>
</div>

<div id="toast" role="status"></div>
<section id="move-panel" role="dialog" aria-label="编辑元素" hidden>
  <div class="ph"><span>编辑元素</span><button class="x" id="move-close" title="取消编辑" aria-label="取消编辑">✕</button></div>
  <div class="elinfo" id="move-target"></div>
  <div class="sum">点击元素框内修改文字，拖动右上角手柄移动。完成保留全部改动，Esc 取消。</div>
  <form id="move-form">
    <div class="row2"><div><label for="move-x">水平偏移 X（px）</label><input id="move-x" type="number" step="any" required value="0"></div><div><label for="move-y">垂直偏移 Y（px）</label><input id="move-y" type="number" step="any" required value="0"></div></div>
    <div class="move-nudge" role="group" aria-label="微调位置"><button type="button" data-move-key="ArrowLeft" aria-label="向左移动 1 像素" title="向左 1px，Shift 点击 10px">←</button><button type="button" data-move-key="ArrowUp" aria-label="向上移动 1 像素" title="向上 1px，Shift 点击 10px">↑</button><button type="button" data-move-key="ArrowDown" aria-label="向下移动 1 像素" title="向下 1px，Shift 点击 10px">↓</button><button type="button" data-move-key="ArrowRight" aria-label="向右移动 1 像素" title="向右 1px，Shift 点击 10px">→</button></div>
    <div class="move-actions"><button type="button" id="move-parent">选择父元素</button><button type="button" id="move-reset">还原位置</button></div>
    <div class="sum" style="margin-top:8px">方向键或箭头按钮微调 1px，按住 Shift 微调 10px。Shift 拖动锁定水平/垂直方向，偏移量相对原位置，完成后点击「发送」交给 Agent。</div>
    <div class="foot"><button id="move-cancel" type="button">取消</button><button class="ok" id="move-apply" type="button">完成</button></div>
  </form>
</section>

<!-- 注入 iframe 的样式 -->
<style type="text/plain" id="bridge-css">
.pb-anno-fab { display: none !important; }
body.pbx-panning, body.pbx-panning * { cursor: grabbing !important; user-select: none !important; }
body.pbx-pick * { cursor: crosshair !important; }
.pbx-move-selected, .pbx-move-selected * { cursor: text !important; }
body.pbx-move { touch-action: none; }
body.pbx-moving, body.pbx-moving * { cursor: grabbing !important; user-select: none !important; }
.pbx-context-selected { outline: 1px solid #27685f !important; outline-offset: 2px; }
#pbx-move-handle { position: absolute; width: 28px; height: 28px; border: 1px solid #95603a; border-radius: 6px; background: #fff; color: #95603a; cursor: grab; pointer-events: auto; touch-action: none; }
.pbx-move-selected { outline: 2px solid #95603a !important; outline-offset: 2px; }
.pbx-hover { outline: 2px solid #27685f !important; outline-offset: -1px; cursor: crosshair !important; }
.pbx-editing { outline: 2px solid #27685f !important; outline-offset: 1px; background: rgba(39,104,95,.07); }
.pbx-edited { text-decoration: underline dotted #95603a; text-underline-offset: 3px; }
#pbx-chip-layer { position: absolute; top: 0; left: 0; width: 100%; height: 0; z-index: 8990; pointer-events: none; }
.pbx-marker-group { position: absolute; display: flex; gap: 4px; flex-wrap: wrap; max-width: 100%; }
.pbx-echip, .pbx-edit-chip, .pbx-move-chip { pointer-events: auto; cursor: pointer; background: #27685f; color: #fff; font: 600 11px/1.2 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 4px 7px; border-radius: 6px; border: 1.5px solid #fff; box-shadow: 0 2px 6px rgba(32,33,31,.28); white-space: nowrap; }
.pbx-echip:hover { background: #1f554e; }
.pbx-edit-chip, .pbx-move-chip { background: #95603a; }
.pbx-edit-chip:hover, .pbx-move-chip:hover { background: #77492b; }
.pbx-echip:focus-visible, .pbx-edit-chip:focus-visible, .pbx-move-chip:focus-visible { outline: 2px solid #20211f; outline-offset: 2px; }
</style>

<!-- 注入 iframe 的桥接脚本(配置来自 window.PROTOBRIDGE_CFG) -->
<script type="text/plain" id="bridge-src">
(function () {
  'use strict';
  if (window.__PB_BRIDGE) return;
  window.__PB_BRIDGE = true;

  var CFG = window.PROTOBRIDGE_CFG || {};
  var PC = CFG.pages || {};
  var CONTAINER = PC.container || '.pg-sec';
  var ACTIVE = PC.activeClass || 'act';
  var IDATTR = PC.idAttr || 'data-page';
  var ROOTID = PC.rootId || 'pg-{id}';
  var SWITCH = PC.switch || 'auto';
  var SINGLE = !!PC.single;                 /* 单文档:整页一页,无活动类约定 */
  var PERFILE = !!PC.singlePerFile;         /* 多文件,每文件整页 */
  var WHOLE = SINGLE || PERFILE;            /* 整页即页根(不分活动容器) */
  var DEFAULTID = PC.defaultId || '';       /* 单文档缺 idAttr 时的稳定页 id */
  var PAGESEL = (!WHOLE && ACTIVE) ? (CONTAINER + '.' + ACTIVE) : CONTAINER;
  var ST = CFG.storage || {};
  var EKEY = ST.edits || 'proto.edits';
  var MKEY = ST.moves || EKEY + '.moves';
  var CKEY = ST.comments || 'proto.anno.comments';
  var NKEY = ST.ecount || 'proto.anno.ecount';
  var WL = ((CFG.ui && CFG.ui.whitelist) || ['.pb-badge', '.pb-pop', '.pb-anno-fab']).concat(['.pbx-echip', '.pbx-edit-chip', '.pbx-move-chip', '#pbx-move-handle']);
  var mode = 'browse';

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

    var head = snapshot.querySelector('head'); head.insertBefore(base, head.firstChild);
    if (doc.adoptedStyleSheets) doc.adoptedStyleSheets.forEach(function (sheet) {
      try { var style = doc.createElement('style'); style.textContent = Array.prototype.map.call(sheet.cssRules, function (rule) { return rule.cssText; }).join('\n'); head.appendChild(style); } catch (e) {}
    });
    var preview = thumb.querySelector('iframe[data-minimap]');
    if (!preview) {
      preview = document.createElement('iframe'); preview.setAttribute('data-minimap', '');
      preview.setAttribute('sandbox', 'allow-same-origin'); preview.setAttribute('aria-hidden', 'true'); preview.tabIndex = -1;
      preview.title = '方案缩略图'; preview.style.cssText = 'display:block;border:0;pointer-events:none;';
      preview.addEventListener('load', function () {
        var loadedDoc = preview.contentDocument;
        Promise.resolve(loadedDoc && loadedDoc.fonts ? loadedDoc.fonts.ready : null).then(function () {
          if (!preview.isConnected || preview.contentDocument !== loadedDoc || pageLoading) return;
          preview.style.visibility = 'visible'; preview.setAttribute('data-ready', '');
        });
      });
      thumb.appendChild(preview);
    }
    preview.style.width = contentW + 'px'; preview.style.height = viewportH + 'px';
    var html = '<!doctype html>' + snapshot.outerHTML;
    if (preview.srcdoc !== html) { preview.style.visibility = 'hidden'; preview.removeAttribute('data-ready'); preview.srcdoc = html; }
    updateMinimapRect();
  }
  function updateMinimapRect() {
    if (!win) return;
    var vp = $('#mmap-vp');
    var width = Math.min(mmapW, Math.max(8, stageW() / scale * mmapScale));
    var height = Math.min(mmapH, Math.max(6, stageH() / scale * mmapScale));
    vp.style.left = mmapLeft + Math.max(0, Math.min(mmapW - width, (stage.scrollLeft - fit.offsetLeft) / scale * mmapScale)) + 'px';
    vp.style.top = Math.max(0, Math.min(mmapH - height, stage.scrollTop / scale * mmapScale)) + 'px';
    vp.style.width = width + 'px'; vp.style.height = height + 'px';
  }
  (function () {
    var body = $('#mmap-body'), dragging = false;
    function jump(e) {
      var r = body.getBoundingClientRect();
      var x = Math.max(0, Math.min(mmapW, e.clientX - r.left - mmapLeft)) / mmapScale;
      var y = Math.max(0, Math.min(mmapH, e.clientY - r.top)) / mmapScale;
      stage.scrollLeft = Math.max(0, x * scale + fit.offsetLeft - stageW() / 2);
      stage.scrollTop = Math.max(0, y * scale + fit.offsetTop - stageH() / 2);
    }
    body.addEventListener('mousedown', function (e) { dragging = true; jump(e); e.preventDefault(); });
    document.addEventListener('mousemove', function (e) { if (dragging) jump(e); });
    document.addEventListener('mouseup', function () { dragging = false; });
  })();
  stage.addEventListener('scroll', updateMinimapRect, { passive: true });
  $('#mmap-fold').addEventListener('click', function () {
    var m = $('#mmap'); m.classList.toggle('fold');
    this.textContent = m.classList.contains('fold') ? '▸' : '▾';
    if (!m.classList.contains('fold')) buildMinimap();
  });

  /* ---------- 启动 ---------- */
  mode = 'browse';
  paintMode(); applyZoom();
})();
</script>
</body>
